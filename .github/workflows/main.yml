name: Build and Release Debian Package

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential meson ninja-build appstream \
            libtool itstool pkg-config intltool libicu-dev libpcre3-dev \
            libglib2.0-dev libgtk-3-dev libxml2-utils dpkg-dev

      - name: Configure Meson
        run: meson setup build --prefix=/usr

      - name: Build
        run: ninja -C build

      - name: Install into staged directory
        run: ninja -C build install --destdir=_pkg

      - name: Create DEBIAN control file
        run: |
          mkdir -p _pkg/DEBIAN
          cat <<EOF > _pkg/DEBIAN/control
          Package: fsearch
          Version: ${GITHUB_REF_NAME#v}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6, libglib2.0-0, libgtk-3-0
          Maintainer: GitHub Actions <actions@example.com>
          Description: FSearch nightly build
           Built automatically by GitHub Actions.
          EOF

      - name: Build .deb
        run: dpkg-deb --build _pkg fsearch_${GITHUB_REF_NAME#v}_amd64.deb

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: fsearch_${GITHUB_REF_NAME#v}_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
